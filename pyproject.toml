[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jijin-ai-fund-company"
version = "1.3.0.dev0"
description = "AI 场外基金公司：个人研究、前瞻模拟盘、飞书交互、硬风控与可审计账本"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13,<2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "APScheduler>=3.10,<4",
  "python-dateutil>=2.9",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Phase-1 CI gate: syntax/runtime-name correctness. Broader style/modernization
# families are intentionally enabled only after the existing backlog is cleaned.
select = ["E9", "F"]
